[package]
name = "takumi-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Renders html to paged pdf with takumi, with the Inter font embedded."
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
html5ever = "0.39"
markup5ever_rcdom = "0.39"
takumi-core = { git = "https://github.com/kane50613/takumi", rev = "3141f1e5f14a0f41deb00ac8cde908423e8abe32" }
takumi-html = { git = "https://github.com/kane50613/takumi", rev = "3141f1e5f14a0f41deb00ac8cde908423e8abe32" }
takumi-pdf = { git = "https://github.com/kane50613/takumi", rev = "3141f1e5f14a0f41deb00ac8cde908423e8abe32" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
